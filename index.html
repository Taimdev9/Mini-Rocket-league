<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rocket Mobile - Fennec</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.skypack.dev/@dimforge/rapier3d-compat@0.11.2"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div class="hud-item">🚗 FENNEC</div>
  <div class="hud-item" id="speed">0 km/h</div>
  <div class="hud-item" id="gamepadStatus">🎮 غير متصل</div>
</div>

<div id="boostBar"><div id="boostFill"></div></div>

<div id="controls">
  <!-- يسار: تحكم -->
  <div class="dpad-group">
    <div class="btn dpad-btn" id="btnLeft">◀</div>
    <div class="btn dpad-btn" id="btnRight">▶</div>
  </div>

  <!-- يمين: فرامل + بوست -->
  <div class="action-group">
    <div class="btn btn-brake" id="btnBrake">🛑</div>
    <div class="btn btn-boost" id="btnBoost">⚡</div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
